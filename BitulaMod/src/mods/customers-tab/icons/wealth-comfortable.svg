<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Comfortable wealth</title>

  <!-- bank note -->
  <rect x="2.2" y="6.2" width="19.6" height="11.6" rx="1.4"
        fill="#77C98B" stroke="#356B45" stroke-width="1.15"/>

  <!-- inner border -->
  <rect x="3.8" y="7.7" width="16.4" height="8.6" rx="0.9"
        fill="#9DE0A9" stroke="#4D8E5D" stroke-width="0.7"/>

  <!-- center medallion -->
  <circle cx="12" cy="12" r="3.15"
          fill="#D4F0B8" stroke="#4D8E5D" stroke-width="0.8"/>

  <!-- currency symbol -->
  <path d="M13.45 9.9c-.45-.4-1.0-.6-1.65-.6
           -1.05 0-1.8.5-1.8 1.2
           0 .72.72 1.0 1.9 1.25
           1.12.25 1.82.55 1.82 1.3
           0 .75-.75 1.25-1.9 1.25
           -.75 0-1.4-.23-1.9-.7"
        fill="none" stroke="#356B45" stroke-width="0.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 8.75v6.5"
        stroke="#356B45" stroke-width="0.65" stroke-linecap="round"/>

  <!-- corner details -->
  <circle cx="5.2" cy="10" r="0.8" fill="#4D8E5D"/>
  <circle cx="18.8" cy="14" r="0.8" fill="#4D8E5D"/>
  <path d="M4.6 14.7h2.3M17.1 9.3h2.3"
        stroke="#4D8E5D" stroke-width="0.7" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M4.1 8.7h4.2"
        stroke="#DDF7D2" stroke-width="0.65" stroke-linecap="round" opacity="0.95"/>
</svg>
