  <circle cx="5.7" cy="13.6" r="0.8" fill="#F6C99C" stroke="#7A5540" stroke-width="0.5"/>
  <circle cx="17.2" cy="13.2" r="0.8" fill="#F6C99C" stroke="#7A5540" stroke-width="0.5"/>

