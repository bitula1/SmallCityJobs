<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Teen age</title>

  <!-- head -->
  <circle cx="11.5" cy="5.2" r="2.5"
          fill="#F2C79C" stroke="#76513E" stroke-width="0.85"/>

  <!-- hair -->
  <path d="M9.1 4.9c.2-1.6 1.5-2.7 3.0-2.7 1.5 0 2.8.8 3.3 2.1
           -1.0-.15-1.9-.5-2.5-1.1-.7.8-1.8 1.3-3.8 1.7Z"
        fill="#4C3B32"/>

  <!-- hoodie body -->
  <path d="M8.1 8.0c1.0-.9 2.1-1.3 3.5-1.3 1.6 0 2.9.5 3.8 1.5
           l1.0 6.0H7.0Z"
        fill="#6D7BE8" stroke="#3E4AA8" stroke-width="0.9" stroke-linejoin="round"/>

  <!-- hood -->
  <path d="M9.0 7.6c.8-1.0 1.6-1.5 2.6-1.5 1.0 0 1.9.5 2.8 1.5"
        fill="none" stroke="#3E4AA8" stroke-width="0.85" stroke-linecap="round"/>

  <!-- arms -->
  <path d="M7.8 8.9 5.8 13.3M15.7 9.0 17.7 12.1"
        fill="none" stroke="#F2C79C" stroke-width="1.5" stroke-linecap="round"/>

  <!-- phone -->
  <rect x="17.0" y="11.5" width="2.0" height="3.2" rx="0.35"
        fill="#2F3542" stroke="#151821" stroke-width="0.5"/>
  <circle cx="18.0" cy="14.1" r="0.13" fill="#BFC7D5"/>

  <!-- pants -->
  <path d="M8.0 13.8h7.1l-.7 6.0h-2.0l-.8-4.3-.9 4.3H8.7Z"
        fill="#394B6A" stroke="#263449" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- sneakers -->
  <path d="M8.1 20.2h3.0" stroke="#F2F2F2" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M12.6 20.2h3.2" stroke="#F2F2F2" stroke-width="1.4" stroke-linecap="round"/>

  <!-- hoodie strings -->
  <path d="M10.9 8.0v1.8M12.4 8.0v1.8"
        stroke="#E7E9FF" stroke-width="0.55" stroke-linecap="round"/>
</svg>
