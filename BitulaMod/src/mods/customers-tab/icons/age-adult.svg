<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Adult age</title>

  <!-- head -->
  <circle cx="11.4" cy="4.8" r="2.45"
          fill="#EFC49A" stroke="#74503C" stroke-width="0.85"/>

  <!-- hair -->
  <path d="M9.1 4.3c.35-1.45 1.5-2.35 3.0-2.35 1.25 0 2.35.55 3.0 1.6
           -1.0-.05-1.8-.3-2.45-.8-.75.55-1.65.95-3.55 1.55Z"
        fill="#5A4437"/>

  <!-- jacket -->
  <path d="M7.9 7.5c1.0-.9 2.2-1.35 3.5-1.35 1.45 0 2.7.45 3.75 1.35
           l1.0 6.6H6.9Z"
        fill="#4F6D8A" stroke="#31485D" stroke-width="0.9" stroke-linejoin="round"/>

  <!-- shirt -->
  <path d="M10.1 6.6h2.6l.7 4.4h-4Z"
        fill="#F0F0EC" stroke="#C3C3BC" stroke-width="0.45"/>

  <!-- tie -->
  <path d="M11.4 7.0 12.1 8.0 11.7 10.4 11.0 10.4 10.7 8.0Z"
        fill="#C94F5D"/>

  <!-- arms -->
  <path d="M7.7 8.5 5.7 13.1M15.4 8.5 17.1 12.1"
        fill="none" stroke="#EFC49A" stroke-width="1.45" stroke-linecap="round"/>

  <!-- briefcase -->
  <rect x="16.2" y="11.8" width="4.0" height="3.5" rx="0.45"
        fill="#7A5639" stroke="#4B3422" stroke-width="0.65"/>
  <path d="M17.2 11.8v-.8h2v.8"
        fill="none" stroke="#4B3422" stroke-width="0.55" stroke-linecap="round"/>

  <!-- trousers -->
  <path d="M7.9 13.8h7.2l-.55 6.0h-2.15l-.8-4.35-.8 4.35H8.35Z"
        fill="#2F3E52" stroke="#1F2A38" stroke-width="0.85" stroke-linejoin="round"/>

  <!-- shoes -->
  <path d="M7.8 20.3h3.1" stroke="#2A241F" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M12.5 20.3h3.2" stroke="#2A241F" stroke-width="1.35" stroke-linecap="round"/>
</svg>
