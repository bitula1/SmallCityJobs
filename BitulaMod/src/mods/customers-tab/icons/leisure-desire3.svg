<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Leisure desire 3 - moderate</title>

  <!-- vivid side hair -->
  <circle cx="3.8" cy="8.0" r="2.6" fill="#FF8A3D"/>
  <circle cx="20.2" cy="8.0" r="2.6" fill="#FF8A3D"/>
  <circle cx="3.3" cy="11.0" r="2.2" fill="#F04E67"/>
  <circle cx="20.7" cy="11.0" r="2.2" fill="#F04E67"/>

  <!-- bright face -->
  <circle cx="12" cy="12" r="9.4" fill="#FFD84D" stroke="#5A4636" stroke-width="1.15"/>

  <!-- vivid blue cap -->
  <path d="M6.4 5.1C7.9 2.9 10 2.1 12 2.1s4.1.8 5.6 3
           c-1.4-.4-2.4-.2-3.4.5C13 4.7 11 4.6 9.8 5.6
           8.8 4.9 7.8 4.7 6.4 5.1Z"
        fill="#35B8F0"/>

  <!-- vivid eye makeup -->
  <path d="M6.7 9.4 8.7 7.6l2 1.9-2 2.1Z" fill="#3E67E8"/>
  <path d="M13.3 9.4l2-1.8 2 1.8-2 2.1Z" fill="#3E67E8"/>

  <!-- open eyes -->
  <circle cx="8.7" cy="9.8" r="0.72" fill="#2F2A28"/>
  <circle cx="15.3" cy="9.8" r="0.72" fill="#2F2A28"/>
  <circle cx="8.45" cy="9.55" r="0.18" fill="#FFFFFF"/>
  <circle cx="15.05" cy="9.55" r="0.18" fill="#FFFFFF"/>

  <!-- bright red clown nose -->
  <circle cx="12" cy="12.5" r="2.05" fill="#F23D4F" stroke="#A92E3B" stroke-width="0.65"/>
  <circle cx="11.4" cy="11.9" r="0.45" fill="#FF9BA4" opacity="0.95"/>

  <!-- vivid cheeks -->
  <circle cx="6.8" cy="14.0" r="1.2" fill="#FF78A5" opacity="0.95"/>
  <circle cx="17.2" cy="14.0" r="1.2" fill="#FF78A5" opacity="0.95"/>

  <!-- clearly positive smile -->
  <path d="M8.0 16.2c1.15 1.15 2.5 1.7 4 1.7s2.85-.55 4-1.7"
        fill="none" stroke="#5A4636" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- vivid pom -->
  <circle cx="12" cy="1.8" r="1.15" fill="#A85CF5"/>
</svg>
