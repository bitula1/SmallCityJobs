  <!-- gold coins overflowing -->
  <circle cx="8.0" cy="9.3" r="1.35" fill="#FFD75A" stroke="#9A7622" stroke-width="0.65"/>
  <circle cx="10.6" cy="8.6" r="1.5" fill="#F4C542" stroke="#9A7622" stroke-width="0.65"/>
  <circle cx="13.3" cy="8.6" r="1.5" fill="#FFD75A" stroke="#9A7622" stroke-width="0.65"/>
  <circle cx="16.0" cy="9.3" r="1.35" fill="#F4C542" stroke="#9A7622" stroke-width="0.65"/>

