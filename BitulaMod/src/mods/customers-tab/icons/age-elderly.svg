<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Elderly age</title>

  <!-- head -->
  <circle cx="10.2" cy="5.2" r="2.35"
          fill="#E8C39E" stroke="#745442" stroke-width="0.85"/>

  <!-- white hair -->
  <path d="M8.1 4.8c.25-1.5 1.3-2.45 2.75-2.45 1.2 0 2.25.5 2.85 1.45
           -.8-.1-1.5-.3-2.1-.7-.65.55-1.45.9-3.5 1.7Z"
        fill="#E6E6E6" stroke="#A5A5A5" stroke-width="0.35"/>

  <!-- stooped torso -->
  <path d="M8.0 7.3c1.0-.65 2.0-.9 3.1-.75 1.3.2 2.35.85 3.0 1.85
           l.2 5.8H7.1Z"
        fill="#8D7AB8" stroke="#56496E" stroke-width="0.9" stroke-linejoin="round"
        transform="rotate(8 10.7 10.5)"/>

  <!-- scarf/collar -->
  <path d="M9.0 7.2c.7.45 1.4.7 2.2.7.7 0 1.35-.2 1.9-.55"
        fill="none" stroke="#C9B8E8" stroke-width="0.75" stroke-linecap="round"/>

  <!-- near arm reaching to cane -->
  <path d="M13.0 8.7 15.8 11.8"
        fill="none" stroke="#E8C39E" stroke-width="1.45" stroke-linecap="round"/>
  <circle cx="15.9" cy="11.9" r="0.7" fill="#E8C39E" stroke="#745442" stroke-width="0.45"/>

  <!-- crooked walking stick -->
  <path d="M18.0 7.6
           c1.35 0 2.0.8 1.95 1.75
           -.05.8-.65 1.45-1.45 1.55
           h-1.2
           l-.9 9.0"
        fill="none" stroke="#7A5534" stroke-width="1.25"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- back arm -->
  <path d="M7.6 8.5 6.0 12.4"
        fill="none" stroke="#E8C39E" stroke-width="1.35" stroke-linecap="round"/>

  <!-- bent legs -->
  <path d="M8.0 13.4 8.8 16.8 7.5 20.0"
        fill="none" stroke="#5B5F66" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11.8 13.7 12.4 16.5 11.8 19.7"
        fill="none" stroke="#5B5F66" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- shoes -->
  <path d="M6.5 20.3h2.3" stroke="#332F2B" stroke-width="1.25" stroke-linecap="round"/>
  <path d="M10.9 20.0h2.3" stroke="#332F2B" stroke-width="1.25" stroke-linecap="round"/>
</svg>
