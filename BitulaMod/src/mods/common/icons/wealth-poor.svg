<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Poor wealth</title>

  <!-- single gray coin -->
  <circle cx="12" cy="12" r="8.2"
          fill="#8F8F8F" stroke="#4F4F4F" stroke-width="1.25"/>

  <!-- inner rim -->
  <circle cx="12" cy="12" r="6.3"
          fill="#A9A9A9" stroke="#666666" stroke-width="0.8"/>

  <!-- simple currency mark -->
  <path d="M13.9 8.6c-.55-.55-1.3-.85-2.15-.85
           -1.45 0-2.55.72-2.55 1.85
           0 1.1 1.05 1.55 2.65 1.9
           1.55.35 2.55.8 2.55 1.95
           0 1.15-1.05 1.95-2.65 1.95
           -1 0-1.9-.35-2.55-1.0"
        fill="none" stroke="#444444" stroke-width="1.15"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M12 6.9v10.2"
        stroke="#444444" stroke-width="0.9" stroke-linecap="round"/>

  <!-- highlight -->
  <path d="M8.2 8.1c1.0-1.0 2.2-1.55 3.7-1.65"
        fill="none" stroke="#D9D9D9" stroke-width="0.9"
        stroke-linecap="round" opacity="0.9"/>
</svg>
