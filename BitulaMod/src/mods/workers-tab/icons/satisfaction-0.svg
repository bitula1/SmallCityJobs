<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- satisfied worker face -->
  <circle cx="12" cy="12.4" r="7.8"
          fill="#66BB6A"
          stroke="#263238"
          stroke-width="2"/>

  <!-- large hard hat -->
  <path d="M5.2 8.3
           C5.6 4.7 8.3 2.4 12 2.4
           C15.7 2.4 18.4 4.7 18.8 8.3
           Z"
        fill="#4F8CC9"
        stroke="#263238"
        stroke-width="2"
        stroke-linejoin="round"/>

  <path d="M4.3 8.4h15.4"
        stroke="#263238"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <!-- helmet ridge -->
  <path d="M12 2.8v5.3"
        stroke="#263238"
        stroke-width="1.6"
        stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="9.2" cy="12.1" r="1.05" fill="#263238"/>
  <circle cx="14.8" cy="12.1" r="1.05" fill="#263238"/>

  <!-- smile -->
  <path d="M8.4 15.3
           C9.4 17 10.6 17.8 12 17.8
           C13.4 17.8 14.6 17 15.6 15.3"
        fill="none"
        stroke="#263238"
        stroke-width="2"
        stroke-linecap="round"/>
</svg>