<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- specialist / technical expert -->
  <circle cx="10.8" cy="5.2" r="3.25"
          fill="#C98F68" stroke="#263238" stroke-width="2"/>

  <!-- glasses -->
  <circle cx="9.5" cy="5.1" r="1.2"
          fill="#8DD2F1" stroke="#263238" stroke-width="1.2"/>
  <circle cx="12.1" cy="5.1" r="1.2"
